# /etc/nginx/snippets/tedzvid-api.conf – API -> Node (server/index.js)
# Uključuje se u server { listen 443 ... } blok: include snippets/tedzvid-api.conf;
location /api/ {
	proxy_pass http://127.0.0.1:3002;
	proxy_http_version 1.1;
	# server uspoređuje Origin s Host – bez ovoga POST prijava/registracija vraća grešku
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	# samo stvarna adresa (ne $proxy_add_x_forwarded_for), da klijent ne zaobiđe limit prijava
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
	client_max_body_size 64k;
}
